# uv workspace root (not itself a package). Members live in python/*. Shared Python tooling config lives here.
[project]
name = "new-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["python/*/src"]   # workspace members are first-party for import sorting
extend-exclude = ["apps", "packages", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["python/*/src", "python/*/tests"]

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = ["--import-mode=importlib", "-ra"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
